services:
  mongodb:
    image: mongo:7
    # Host 27018 avoids clashing with Homebrew MongoDB on 27017
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./storage:/app/storage
    depends_on:
      - mongodb
      - redis

  celery_worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env
    volumes:
      - .:/app
      - ./storage:/app/storage
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
